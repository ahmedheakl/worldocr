### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_dropout: 0.1
lora_rank: 64
lora_target: ['q_proj', 'k_proj', 'v_proj', 'o_proj', 'gate_proj', 'up_proj', 'down_proj']  # Specific modules instead of 'all'
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_config.json

### dataset
dataset: worldocr_comp_v1
template: qwen2_vl
cutoff_len: 8192
max_samples: 10000000
overwrite_cache: false
preprocessing_num_workers: 4
dataloader_num_workers: 4

### output
output_dir: ../checkpoints/qwen25vl-3b-comp-v1
logging_steps: 10
save_steps: 10000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: wandb 
run_name: qwen25vl-3b-comp-v1

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
weight_decay: 0.01
ddp_timeout: 180000000
resume_from_checkpoint: null
optim: adamw_torch_fused
gradient_checkpointing: true
flash_attn: fa2
shift_attn: false  # Ensure this is false for vision models
use_reentrant_gc: false
enable_liger_kernel: true

